[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kssd-segmentation"
version = "0.1.0"
description = "Reproducible KSSD2025 segmentation experiments"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "Pillow==11.1.0", "scipy==1.15.3", "scikit-learn==1.7.2"]

[project.optional-dependencies]
train = ["tensorflow==2.20.0", "keras==3.13.2", "keras-unet-collection==0.1.13", "matplotlib==3.10.0"]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["kssd*"]
